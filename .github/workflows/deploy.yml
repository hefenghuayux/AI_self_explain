name: Build and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          BACKEND_IMAGE: ci/ai-self-explain-backend
          FRONTEND_IMAGE: ci/ai-self-explain-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          sh -n deploy/deploy.sh
          printf 'DOMAIN=http://:80\n' > .env.production
          trap 'rm -f .env.production' EXIT
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install backend dependencies
        run: |
          uv lock --check --project backend
          uv sync --frozen --extra dev --project backend

      - name: Validate deployment scripts
        run: |
          python -m py_compile deploy/quick_deploy.py deploy/quick_deploy_server.py
          uv run --frozen --no-sync --project backend python -m ruff check deploy/quick_deploy.py deploy/quick_deploy_server.py

      - name: Check backend
        run: |
          uv run --frozen --no-sync --project backend python -m pytest backend/tests
          uv run --frozen --no-sync --project backend python -m ruff check backend
          uv run --frozen --no-sync --project backend python -m ruff format --check backend

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check frontend
        env:
          BACKEND_PROXY_TARGET: http://backend:8000
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend typecheck
          pnpm --dir frontend build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: "182.92.219.177"
      DEPLOY_USER: devuser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check latest main commit
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$DEPLOY_COMMIT" != "$main_commit" ]; then
            echo "Skipping deployment: this commit is no longer the main branch head."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy pushed commit to AI self-explanation server
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!variable}" ]; then
              echo "Missing required repository secret: $variable" >&2
              exit 1
            fi
          done
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$ssh_dir"
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          python deploy/quick_deploy.py \
            --server "$DEPLOY_HOST" --user "$DEPLOY_USER" \
            --key "$ssh_dir/key" --known-hosts "$ssh_dir/known_hosts" \
            --commit "$DEPLOY_COMMIT" | tee "$RUNNER_TEMP/deployment.log"
          release=$(sed -n 's/^DEPLOYMENT_SUCCEEDED //p' "$RUNNER_TEMP/deployment.log" | tail -n 1)
          test -n "$release"
          printf 'Commit: `%s`\n\nServer: `%s@%s`\n\nRelease: `%s`\n' \
            "$DEPLOY_COMMIT" "$DEPLOY_USER" "$DEPLOY_HOST" "$release" >> "$GITHUB_STEP_SUMMARY"
